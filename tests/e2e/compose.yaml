services:
  mock:
    image: python:3.12-alpine
    command: ["python", "/fixture/upstream.py"]
    volumes:
      - ./upstream.py:/fixture/upstream.py:ro
  cpa:
    image: eceasy/cli-proxy-api:v8.1.0@sha256:098ee6aaadf399f1812f3bba959c593182e3a44f5f1d28a8ec44b8c827ebd942
    volumes:
      - ./cpa.yaml:/CLIProxyAPI/config.yaml:ro
    ports:
      - "127.0.0.1:8582:8317"
    depends_on:
      - mock
  ext:
    image: cpa-ext:dev
    environment:
      CPA_BASE_URL: http://cpa:8317
      CPA_MANAGEMENT_KEY: fixture-management-secret-local-only
      ADMIN_PASSWORD: fixture-administrator-secret-local-only
      STATE_DIR: /data
      GATEWAY_ADDR: 0.0.0.0:8480
      ADMIN_ADDR: 0.0.0.0:8481
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:8580:8480"
      - "127.0.0.1:8581:8481"
    depends_on:
      - cpa
