<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXT</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="workspace">
  <main>
    <header class="page-header">
      <div class="title-row">
        <h1>EXT</h1>
        <nav class="tabs" aria-label="EXT 管理">
          <button data-page="overview" type="button">用量总览</button>
          <button data-page="keys" type="button">密钥限制</button>
          <button data-page="events" type="button">请求明细</button>
          <button data-page="sessions" type="button">会话审计</button>
        </nav>
      </div>
      <div class="toolbar">
        <p id="description" class="description"></p>
        <div class="page-actions">
          <p id="health" class="health" role="status"><span></span>正在连接</p>
          <button id="refresh" type="button">刷新</button>
          <button id="logout" class="quiet" type="button">退出</button>
        </div>
      </div>
    </header>
    <div id="message" role="status"></div>
    <section id="content" aria-live="polite"></section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
