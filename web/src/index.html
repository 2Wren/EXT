<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cpa-ext</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="workspace">
  <main>
    <header class="page-header">
      <div class="title-row">
        <h1>cpa-ext</h1>
        <nav class="tabs" aria-label="cpa-ext 管理">
          <button data-page="overview" type="button">用量总览</button>
          <button data-page="keys" type="button">Key 额度</button>
          <button data-page="events" type="button">消费流水</button>
          <button data-page="sessions" type="button">会话审计</button>
        </nav>
      </div>
      <div class="toolbar">
        <p id="description" class="description"></p>
        <div class="page-actions">
          <p id="health" class="health" role="status"><span></span>正在连接</p>
          <label class="range-picker" for="days"><span class="sr-only">时间范围</span>
            <select id="days"><option value="7">近 7 天</option><option value="14">近 14 天</option><option value="30" selected>近 30 天</option></select>
          </label>
          <a id="cpa-auth-link" class="button-link" href="/management.html#/auth-files">CPA 认证文件 ↗</a>
          <button id="refresh" type="button">刷新</button>
          <button id="demo-toggle" type="button" disabled>显示演示数据</button>
          <button id="logout" class="quiet" type="button">退出</button>
        </div>
      </div>
    </header>
    <p id="demo-note" class="demo-note" role="status" hidden><strong>演示数据</strong><span>模拟用量和会话，仅供只读预览。</span></p>
    <div id="message" role="status"></div>
    <section id="content" aria-live="polite"></section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
