services:
  cpa:
    image: eceasy/cli-proxy-api:v8.1.0@sha256:098ee6aaadf399f1812f3bba959c593182e3a44f5f1d28a8ec44b8c827ebd942
    restart: unless-stopped
    command: ["./CLIProxyAPI", "-config", "/config/config.yaml"]
    environment:
      MANAGEMENT_STATIC_PATH: /panel
    volumes:
      - ./state/cpa-config:/config
      - ./state/cpa-auth:/root/.cli-proxy-api
      - ./state/panel:/panel
      - ./state/cpa-plugins:/plugins
    # Loopback only: the reverse proxy falls back to CPA while cpa-ext restarts.
    ports:
      - "127.0.0.1:8317:8317"
  cpa-ext:
    image: cpa-ext:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # In-flight streams get SHUTDOWN_GRACE_SECONDS (120) to finish on restart.
    stop_grace_period: 150s
    user: "${CPA_EXT_UID:-1000}:${CPA_EXT_GID:-1000}"
    read_only: true
    environment:
      CPA_BASE_URL: http://cpa:8317
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?Run deploy/init.sh first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run deploy/init.sh first}
      STATE_DIR: /data
      GATEWAY_ADDR: 0.0.0.0:8480
      ADMIN_ADDR: 0.0.0.0:8481
      PANEL_ADDR: 0.0.0.0:8482
      AUDIT_KEEP_DAYS: ${AUDIT_KEEP_DAYS:-14}
      AUDIT_MAX_GIB: ${AUDIT_MAX_GIB:-20}
      DISK_MIN_GIB: ${DISK_MIN_GIB:-10}
    volumes:
      - ./state/ext:/data
    ports:
      - "127.0.0.1:8480:8480"
      - "127.0.0.1:8481:8481"
      - "127.0.0.1:8482:8482"
    depends_on:
      - cpa
